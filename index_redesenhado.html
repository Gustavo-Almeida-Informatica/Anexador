<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="Perfil e projetos de Gustavo Almeida">
  <title>Gustavo Almeida | Anexador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      min-height:100vh; color:#fff;
      font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:
        radial-gradient(circle at 50% 0%,rgba(255,49,95,.20),transparent 35%),
        radial-gradient(circle at 0% 50%,rgba(155,55,255,.10),transparent 30%),
        radial-gradient(circle at 100% 80%,rgba(255,49,95,.08),transparent 30%),
        #08080d;
      overflow-x:hidden;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
      background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:40px 40px;
      mask-image:linear-gradient(to bottom,black,transparent 80%);
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    main { width:100%; max-width:620px; margin:0 auto; padding:42px 18px 55px; }
    .top-line {
      width:70px;height:4px;margin:0 auto 30px;border-radius:999px;
      background:linear-gradient(90deg,#ff315f,#c13cff,#ff315f);
      box-shadow:0 0 15px rgba(255,49,95,.5),0 0 30px rgba(193,60,255,.2);
    }
    .perfil { text-align:center; animation:aparecer .8s ease both; }
    .foto-area { position:relative;width:174px;height:174px;margin:0 auto 24px; }
    .foto-glow {
      position:absolute;inset:-18px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,49,95,.35),rgba(193,60,255,.15) 40%,transparent 70%);
      filter:blur(8px);animation:pulsar 4s ease-in-out infinite;
    }
    .foto-borda {
      position:relative;width:174px;height:174px;padding:5px;border-radius:50%;
      background:linear-gradient(135deg,#ff315f,#ff5f87,#c13cff,#ff315f);
      box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 30px rgba(255,49,95,.25),0 0 60px rgba(193,60,255,.12);
    }
    .foto-borda::before {
      content:"";position:absolute;inset:-4px;border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
    }
    .foto-borda img {
      width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
      border:5px solid #08080d;background:#16161d;
    }
    .status {
      position:absolute;right:7px;bottom:12px;width:22px;height:22px;border-radius:50%;
      background:#22c55e;border:4px solid #08080d;box-shadow:0 0 10px rgba(34,197,94,.65);
    }
    .nome {
      font-size:clamp(1.7rem,7vw,2.2rem);font-weight:800;letter-spacing:-.04em;margin-bottom:9px;
      background:linear-gradient(90deg,#fff,#ffb8c8,#d9b8ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .subtitulo { color:#a9a9b4;font-size:.95rem;margin-bottom:24px; }
    .estatisticas { display:flex;justify-content:center;gap:10px;margin:0 auto 30px; }
    .estatistica {
      min-width:105px;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    }
    .estatistica strong { display:block;font-size:1.05rem;font-weight:800;color:#fff; }
    .estatistica span { display:block;margin-top:3px;font-size:.68rem;color:#858591;text-transform:uppercase;letter-spacing:.08em; }
    .redes { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:42px; }
    .rede {
      position:relative;display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;
      border-radius:18px;border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
      box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      overflow:hidden;transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease;
    }
    .rede::before {
      content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.06),transparent 80%);
      transform:translateX(-100%);transition:transform .6s ease;
    }
    .rede:hover {
      transform:translateY(-4px);border-color:rgba(255,49,95,.35);
      background:linear-gradient(135deg,rgba(255,49,95,.10),rgba(193,60,255,.07));
      box-shadow:0 14px 35px rgba(0,0,0,.28),0 0 25px rgba(255,49,95,.08);
    }
    .rede:hover::before { transform:translateX(100%); }
    .rede:active { transform:scale(.98); }
    .icone-rede { width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.06);overflow:hidden; }
    .icone-rede svg { width:43px;height:43px;display:block; }
    .rede-info { min-width:0;text-align:left; }
    .rede-nome { display:block;font-size:.75rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px; }
    .rede-usuario { display:block;color:#8d8d99;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .seta { margin-left:auto;color:#656570;font-size:1rem;transition:transform .25s ease,color .25s ease; }
    .rede:hover .seta { transform:translate(3px,-3px);color:#ff6686; }
    .secao-titulo { display:flex;align-items:center;gap:12px;margin-bottom:16px; }
    .secao-titulo::before { content:"";width:4px;height:26px;border-radius:999px;background:linear-gradient(to bottom,#ff315f,#c13cff);box-shadow:0 0 12px rgba(255,49,95,.4); }
    .secao-titulo-texto h2 { font-size:1.15rem;font-weight:800;letter-spacing:-.02em; }
    .secao-titulo-texto p { margin-top:3px;color:#777783;font-size:.72rem; }
    .projetos { display:grid;gap:12px;margin-bottom:32px; }
    .projeto {
      position:relative;display:flex;align-items:center;gap:15px;min-height:86px;padding:14px 16px;
      border-radius:20px;border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
      box-shadow:0 10px 30px rgba(0,0,0,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      overflow:hidden;transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease;
    }
    .projeto::after {
      content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(to bottom,#ff315f,#c13cff);opacity:.65;transition:opacity .25s ease;
    }
    .projeto:hover {
      transform:translateY(-4px);border-color:rgba(255,49,95,.30);
      background:linear-gradient(135deg,rgba(255,49,95,.09),rgba(193,60,255,.06));
      box-shadow:0 16px 40px rgba(0,0,0,.25),0 0 25px rgba(255,49,95,.06);
    }
    .projeto:hover::after { opacity:1; }
    .projeto:active { transform:scale(.985); }
    .projeto-icone {
      width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:15px;
      background:linear-gradient(135deg,rgba(255,49,95,.14),rgba(193,60,255,.10));
      border:1px solid rgba(255,255,255,.08);color:#ff6686;font-size:1.3rem;
    }
    .projeto-info { min-width:0;flex:1;text-align:left; }
    .projeto-nome { display:block;color:#fff;font-size:.93rem;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .projeto-tipo { display:block;margin-top:5px;color:#7f7f8a;font-size:.72rem; }
    .projeto-seta {
      width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border-radius:50%;
      background:rgba(255,255,255,.045);color:#8b8b96;transition:transform .25s ease,background .25s ease,color .25s ease;
    }
    .projeto:hover .projeto-seta { transform:translateX(4px);background:rgba(255,49,95,.14);color:#ff6686; }
    .compartilhar {
      width:100%;display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:12px 18px;
      border:1px solid rgba(255,255,255,.10);border-radius:16px;color:#fff;
      background:linear-gradient(135deg,rgba(255,49,95,.12),rgba(193,60,255,.10));cursor:pointer;
      transition:transform .2s ease,border-color .2s ease,background .2s ease;
    }
    .compartilhar:hover { transform:translateY(-2px);border-color:rgba(255,49,95,.35);background:linear-gradient(135deg,rgba(255,49,95,.18),rgba(193,60,255,.14)); }
    .compartilhar:active { transform:scale(.98); }
    .compartilhar svg { width:19px;height:19px; }
    footer { margin-top:35px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);text-align:center; }
    footer p { color:#5e5e69;font-size:.68rem;letter-spacing:.03em; }
    footer strong { color:#868692; }
    .toast {
      position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,20px);opacity:0;pointer-events:none;
      padding:11px 17px;border-radius:999px;background:rgba(25,25,32,.94);border:1px solid rgba(255,255,255,.10);
      color:#fff;font-size:.78rem;box-shadow:0 10px 35px rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      transition:opacity .25s ease,transform .25s ease;
    }
    .toast.mostrar { opacity:1;transform:translate(-50%,0); }
    @keyframes aparecer { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulsar { 0%,100%{transform:scale(.96);opacity:.75} 50%{transform:scale(1.05);opacity:1} }
    .redes .rede:nth-child(1){animation:aparecer .6s ease .10s both}
    .redes .rede:nth-child(2){animation:aparecer .6s ease .16s both}
    .redes .rede:nth-child(3){animation:aparecer .6s ease .22s both}
    .redes .rede:nth-child(4){animation:aparecer .6s ease .28s both}
    .projetos .projeto:nth-child(1){animation:aparecer .6s ease .32s both}
    .projetos .projeto:nth-child(2){animation:aparecer .6s ease .38s both}
    .projetos .projeto:nth-child(3){animation:aparecer .6s ease .44s both}
    .projetos .projeto:nth-child(4){animation:aparecer .6s ease .50s both}
    a:focus-visible,button:focus-visible { outline:2px solid #ff6686;outline-offset:4px; }
    @media (max-width:520px) {
      main{padding:30px 15px 45px}
      .redes{grid-template-columns:1fr}
      .rede{min-height:64px}
      .estatisticas{gap:7px}
      .estatistica{min-width:0;flex:1;padding:11px 8px}
      .foto-area,.foto-borda{width:160px;height:160px}
      .nome{font-size:1.8rem}
    }
    @media (max-width:360px) {
      .estatistica strong{font-size:.95rem}
      .estatistica span{font-size:.58rem}
      .projeto{padding:13px}
      .projeto-icone{width:45px;height:45px;flex-basis:45px}
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>

<body>
  <main>
    <div class="top-line"></div>

    <section class="perfil">
      <div class="foto-area">
        <div class="foto-glow"></div>
        <div class="foto-borda">
          <img id="foto" src="perfil.jpg" alt="Foto de perfil">
        </div>
        <span class="status" title="Perfil ativo" aria-label="Perfil ativo"></span>
      </div>

      <h1 class="nome" id="nome"></h1>
      <p class="subtitulo">Meu perfil e meus projetos</p>

      <div class="estatisticas">
        <div class="estatistica">
          <strong id="totalProjetos">0</strong>
          <span>Projetos</span>
        </div>
        <div class="estatistica">
          <strong id="totalRedes">0</strong>
          <span>Redes</span>
        </div>
      </div>
    </section>

    <nav class="redes" id="redes" aria-label="Redes sociais"></nav>

    <section>
      <div class="secao-titulo">
        <div class="secao-titulo-texto">
          <h2>Meus projetos</h2>
          <p>Conheça meus trabalhos e projetos</p>
        </div>
      </div>

      <nav class="projetos" id="projetos" aria-label="Projetos"></nav>
    </section>

    <button class="compartilhar" id="compartilhar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
      Compartilhar meu perfil
    </button>

    <footer>
      <p>Feito por <strong>Gustavo Almeida</strong></p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CONFIG = {
      nome: "GUSTAVO ALMEIDA",

      redes: [
        { tipo:"instagram", usuario:"@gustavo.almeida.oficial", url:"https://www.instagram.com/gustavo.almeida.ofc?stkn=MXhibWI0dnBoOHY4NQ==" },
        { tipo:"tiktok", usuario:"@gustavo.almeida.oficial", url:"https://www.tiktok.com/@gustavo.almeida.oficial?_r=1&_t=ZS-9AB0p246MHE" },
        { tipo:"linkedin", usuario:"Gustavo Almeida Moura", url:"https://www.linkedin.com/in/gustavo-almeida-moura-18a67732b?utm_source=share_via&utm_content=profile&utm_medium=member_android" },
        { tipo:"github", usuario:"Gustavo Almeida", url:"https://github.com/Gustavo-Almeida-Informatica" }
      ],

      projetos: [
        { nome:"PROJETA AULA", url:"https://projetaaula.lovable.app" },
        { nome:"ENEM NOTA MAX", url:"https://enem-nota-max.ai.studio" },
        { nome:"Era nuclear", url:"https://github.com/Gustavo-Almeida-Informatica/Era-nuclear" },
        { nome:"em desenvolvimento", url:"https://github.com/Gustavo-Almeida-Informatica/WhatsIA_Control" }
      ],

      fotoPeloPerfil:true,

      fotos:{
        instagram:"perfil.jpg",
        tiktok:"perfil.jpg",
        padrao:"perfil.jpg"
      }
    };

    const ICONES = {
      instagram: `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <defs>
            <linearGradient id="instagramGradient" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#ffb13b"/>
              <stop offset=".45" stop-color="#ff315f"/>
              <stop offset="1" stop-color="#8b3dff"/>
            </linearGradient>
          </defs>
          <rect width="52" height="52" rx="15" fill="url(#instagramGradient)"/>
          <rect x="11" y="11" width="30" height="30" rx="9" fill="none" stroke="#fff" stroke-width="3.5"/>
          <circle cx="26" cy="26" r="7" fill="none" stroke="#fff" stroke-width="3.5"/>
          <circle cx="35" cy="17" r="2" fill="#fff"/>
        </svg>`,

      tiktok: `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <rect width="52" height="52" rx="15" fill="#090909"/>
          <path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#25f4ee" stroke-width="4.5" stroke-linecap="round" transform="translate(-1.5 1)"/>
          <path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#fe2c55" stroke-width="4.5" stroke-linecap="round" transform="translate(1.5 -1)"/>
          <path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        </svg>`,

      linkedin: `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <rect width="52" height="52" rx="13" fill="#0a66c2"/>
          <rect x="9" y="20" width="7" height="22" fill="#fff"/>
          <circle cx="12.5" cy="12.5" r="4" fill="#fff"/>
          <path d="M21 20h7v3c1.5-2.4 4-3.6 7-3.6 6 0 8 3.6 8 9.6V42h-7V30c0-3-1-4.6-3.6-4.6S28 27 28 30v12h-7z" fill="#fff"/>
        </svg>`,

      github: `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <rect width="52" height="52" rx="13" fill="#18181b"/>
          <path d="M26 8C16 8 8 16.2 8 26.4c0 8.1 5.2 15 12.4 17.4.9.2 1.2-.4 1.2-.9v-3.4c-5 .9-6.1-2.2-6.1-2.2-.8-2.1-2-2.7-2-2.7-1.7-1.2.1-1.2.1-1.2 1.9.1 2.9 2 2.9 2 1.7 2.9 4.5 2.1 5.6 1.6.2-1.2.7-2.1 1.2-2.6-4-.5-8.2-2.1-8.2-9.1 0-2 .7-3.6 1.9-4.9-.2-.5-.8-2.4.2-4.9 0 0 1.6-.5 5.1 1.9 1.5-.4 3-.6 4.6-.6s3.1.2 4.6.6c3.5-2.4 5.1-1.9 5.1-1.9 1 2.5.4 4.4.2 4.9 1.2 1.3 1.9 2.9 1.9 4.9 0 7-4.2 8.6-8.2 9.1.7.6 1.3 1.8 1.3 3.6v5.3c0 .5.3 1.1 1.2.9C38.8 41.4 44 34.5 44 26.4 44 16.2 36 8 26 8z" fill="#fff"/>
        </svg>`
    };

    document.getElementById("nome").textContent = CONFIG.nome;
    document.getElementById("totalProjetos").textContent = CONFIG.projetos.length;
    document.getElementById("totalRedes").textContent = CONFIG.redes.length;

    const nomesRedes = {
      instagram:"Instagram",
      tiktok:"TikTok",
      linkedin:"LinkedIn",
      github:"GitHub"
    };

    document.getElementById("redes").innerHTML = CONFIG.redes.map(rede => `
      <a class="rede" href="${rede.url}" target="_blank" rel="noopener noreferrer"
         aria-label="Abrir ${nomesRedes[rede.tipo] || rede.tipo}">
        <div class="icone-rede">${ICONES[rede.tipo] || ""}</div>
        <div class="rede-info">
          <span class="rede-nome">${nomesRedes[rede.tipo] || rede.tipo}</span>
          <span class="rede-usuario">${rede.usuario}</span>
        </div>
        <span class="seta" aria-hidden="true">↗</span>
      </a>
    `).join("");

    const iconesProjetos = ["🚀","🎯","⚛","💻"];

    document.getElementById("projetos").innerHTML = CONFIG.projetos.map((projeto,index) => `
      <a class="projeto" href="${projeto.url}" target="_blank" rel="noopener noreferrer"
         aria-label="Abrir projeto ${projeto.nome}">
        <div class="projeto-icone">${iconesProjetos[index] || "✦"}</div>
        <div class="projeto-info">
          <span class="projeto-nome">${projeto.nome}</span>
          <span class="projeto-tipo">Projeto</span>
        </div>
        <span class="projeto-seta" aria-hidden="true">→</span>
      </a>
    `).join("");

    function origem() {
      const param = new URLSearchParams(location.search).get("from");
      if (param) return param.toLowerCase();

      const ua = navigator.userAgent || "";
      if (/Instagram/i.test(ua)) return "instagram";
      if (/TikTok|musical_ly|Bytedance/i.test(ua)) return "tiktok";
      return "padrao";
    }

    function usuarioDaUrl(rede) {
      const r = CONFIG.redes.find(item => item.tipo === rede);
      if (!r) return null;

      try {
        const partes = new URL(r.url).pathname.split("/").filter(Boolean);
        return (partes[0] || "").replace(/^@/,"") || null;
      } catch {
        return null;
      }
    }

    function fotosParaTentar() {
      const origemAtual = origem();
      const lista = [];
      const user = usuarioDaUrl(origemAtual);

      if (CONFIG.fotoPeloPerfil && user && origemAtual !== "padrao") {
        if (origemAtual === "github") {
          lista.push(`https://github.com/${user}.png`);
        } else {
          lista.push(`https://unavatar.io/${origemAtual}/${user}`);
        }
      }

      if (CONFIG.fotos[origemAtual]) lista.push(CONFIG.fotos[origemAtual]);
      lista.push(CONFIG.fotos.padrao);
      return lista;
    }

    const foto = document.getElementById("foto");
    const tentativas = fotosParaTentar();

    function proximaFoto() {
      if (!tentativas.length) return;
      foto.onerror = proximaFoto;
      foto.src = tentativas.shift();
    }

    proximaFoto();

    const botaoCompartilhar = document.getElementById("compartilhar");
    const toast = document.getElementById("toast");

    function mostrarToast(mensagem) {
      toast.textContent = mensagem;
      toast.classList.add("mostrar");

      clearTimeout(window.__toastTimeout);

      window.__toastTimeout = setTimeout(() => {
        toast.classList.remove("mostrar");
      }, 2400);
    }

    async function compartilharPerfil() {
      const dados = {
        title:"Gustavo Almeida | Anexador",
        text:"Confira meu perfil e meus projetos.",
        url:window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(dados);
          return;
        } catch (erro) {
          if (erro && erro.name === "AbortError") return;
        }
      }

      try {
        await navigator.clipboard.writeText(window.location.href);
        mostrarToast("Link copiado para a área de transferência!");
      } catch {
        const campo = document.createElement("input");
        campo.value = window.location.href;
        document.body.appendChild(campo);
        campo.select();
        document.execCommand("copy");
        campo.remove();
        mostrarToast("Link copiado!");
      }
    }

    botaoCompartilhar.addEventListener("click", compartilharPerfil);
  </script>
</body>
</html>
