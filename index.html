<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080d" id="themeColor">
<meta name="description" content="Perfil e projetos de Gustavo Almeida">
<title>Gustavo Almeida | Anexador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Variáveis de cor — atualizadas automaticamente pela foto
   ══════════════════════════════════════════════════════════════ */
:root {
  --c1: 255, 49, 95;    /* cor principal  (padrão: rosa)  */
  --c2: 193, 60, 255;   /* cor secundária (padrão: roxo)  */
  --bg: 8, 8, 13;       /* fundo base                     */
}

/* Oculta a página até a cor da foto ser extraída             */
body { opacity: 0; }

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  min-height:100vh;color:#fff;
  font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(var(--c1),.20), transparent 35%),
    radial-gradient(circle at 0%  50%, rgba(var(--c2),.10), transparent 30%),
    radial-gradient(circle at 100% 80%,rgba(var(--c1),.08), transparent 30%),
    rgb(var(--bg));
  overflow-x:hidden;
}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}

a{color:inherit;text-decoration:none}
button{font:inherit}
main{width:100%;max-width:620px;margin:0 auto;padding:42px 18px 55px}

/* ── Linha decorativa topo ─────────────────────────────────── */
.top-line{
  width:70px;height:4px;margin:0 auto 30px;border-radius:999px;
  background:linear-gradient(90deg,rgb(var(--c1)),rgb(var(--c2)),rgb(var(--c1)));
  box-shadow:0 0 15px rgba(var(--c1),.5),0 0 30px rgba(var(--c2),.2);
}

/* ── Perfil ────────────────────────────────────────────────── */
.perfil{text-align:center;animation:aparecer .8s ease both}

.foto-area{position:relative;width:174px;height:174px;margin:0 auto 24px}

.foto-glow{
  position:absolute;inset:-18px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--c1),.35),rgba(var(--c2),.15) 40%,transparent 70%);
  filter:blur(8px);animation:pulsar 4s ease-in-out infinite;
}

.foto-borda{
  position:relative;width:174px;height:174px;padding:5px;border-radius:50%;
  background:linear-gradient(135deg,rgb(var(--c1)),rgb(var(--c2)),rgb(var(--c1)));
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 30px rgba(var(--c1),.25),0 0 60px rgba(var(--c2),.12);
}

.foto-borda::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);
}

.foto-borda img{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  border:5px solid rgb(var(--bg));background:#16161d;
}

.status{
  position:absolute;right:7px;bottom:12px;width:22px;height:22px;border-radius:50%;
  background:#22c55e;border:4px solid rgb(var(--bg));
  box-shadow:0 0 10px rgba(34,197,94,.65);
}

.nome{
  font-size:clamp(1.7rem,7vw,2.2rem);font-weight:800;letter-spacing:-.04em;margin-bottom:9px;
  background:linear-gradient(90deg,#fff,rgba(var(--c1),.85),rgba(var(--c2),.75));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.subtitulo{color:#a9a9b4;font-size:.95rem;margin-bottom:24px}

.estatisticas{display:flex;justify-content:center;gap:10px;margin:0 auto 30px}

.estatistica{
  min-width:105px;padding:12px 16px;border-radius:16px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}

.estatistica strong{display:block;font-size:1.05rem;font-weight:800;color:#fff}
.estatistica span{display:block;margin-top:3px;font-size:.68rem;color:#858591;text-transform:uppercase;letter-spacing:.08em}

/* ── Redes sociais ─────────────────────────────────────────── */
.redes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:42px}

.rede{
  position:relative;display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;
  border-radius:18px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:hidden;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;
}

.rede::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.06),transparent 80%);
  transform:translateX(-100%);transition:transform .6s;
}

.rede:hover{
  transform:translateY(-4px);border-color:rgba(var(--c1),.35);
  background:linear-gradient(135deg,rgba(var(--c1),.10),rgba(var(--c2),.07));
  box-shadow:0 14px 35px rgba(0,0,0,.28),0 0 25px rgba(var(--c1),.08);
}

.rede:hover::before{transform:translateX(100%)}
.rede:active{transform:scale(.98)}

.icone-rede{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.06);overflow:hidden}
.icone-rede svg{width:43px;height:43px;display:block}
.rede-info{min-width:0;text-align:left}
.rede-nome{display:block;font-size:.75rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.rede-usuario{display:block;color:#8d8d99;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seta{margin-left:auto;color:#656570;font-size:1rem;transition:transform .25s,color .25s}
.rede:hover .seta{transform:translate(3px,-3px);color:rgb(var(--c1))}

/* ── Título de seção ───────────────────────────────────────── */
.secao-titulo{display:flex;align-items:center;gap:12px;margin-bottom:16px}

.secao-titulo::before{
  content:"";width:4px;height:26px;border-radius:999px;
  background:linear-gradient(to bottom,rgb(var(--c1)),rgb(var(--c2)));
  box-shadow:0 0 12px rgba(var(--c1),.4);
}

.secao-titulo-texto h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.secao-titulo-texto p{margin-top:3px;color:#777783;font-size:.72rem}

/* ── Projetos ──────────────────────────────────────────────── */
.projetos{display:grid;gap:12px;margin-bottom:32px}

.projeto{
  position:relative;display:flex;align-items:center;gap:15px;min-height:86px;padding:14px 16px;
  border-radius:20px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  box-shadow:0 10px 30px rgba(0,0,0,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:hidden;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;
}

.projeto::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(to bottom,rgb(var(--c1)),rgb(var(--c2)));
  opacity:.65;transition:opacity .25s;
}

.projeto:hover{
  transform:translateY(-4px);border-color:rgba(var(--c1),.30);
  background:linear-gradient(135deg,rgba(var(--c1),.09),rgba(var(--c2),.06));
  box-shadow:0 16px 40px rgba(0,0,0,.25),0 0 25px rgba(var(--c1),.06);
}

.projeto:hover::after{opacity:1}
.projeto:active{transform:scale(.985)}

.projeto-icone{
  width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:15px;
  background:linear-gradient(135deg,rgba(var(--c1),.14),rgba(var(--c2),.10));
  border:1px solid rgba(255,255,255,.08);color:rgb(var(--c1));font-size:1.3rem;
}

.projeto-info{min-width:0;flex:1;text-align:left}
.projeto-nome{display:block;color:#fff;font-size:.93rem;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projeto-tipo{display:block;margin-top:5px;color:#7f7f8a;font-size:.72rem}

.projeto-seta{
  width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.045);color:#8b8b96;
  transition:transform .25s,background .25s,color .25s;
}

.projeto:hover .projeto-seta{transform:translateX(4px);background:rgba(var(--c1),.14);color:rgb(var(--c1))}

/* ── Botão compartilhar ────────────────────────────────────── */
.compartilhar{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:12px 18px;
  border:1px solid rgba(255,255,255,.10);border-radius:16px;color:#fff;
  background:linear-gradient(135deg,rgba(var(--c1),.12),rgba(var(--c2),.10));cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s;
}

.compartilhar:hover{transform:translateY(-2px);border-color:rgba(var(--c1),.35);background:linear-gradient(135deg,rgba(var(--c1),.18),rgba(var(--c2),.14))}
.compartilhar:active{transform:scale(.98)}
.compartilhar svg{width:19px;height:19px}

/* ── Footer e toast ────────────────────────────────────────── */
footer{margin-top:35px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);text-align:center}
footer p{color:#5e5e69;font-size:.68rem;letter-spacing:.03em}
footer strong{color:#868692}

.toast{
  position:fixed;left:50%;bottom:24px;z-index:100;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 17px;border-radius:999px;
  background:rgba(25,25,32,.94);border:1px solid rgba(255,255,255,.10);
  color:#fff;font-size:.78rem;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .25s,transform .25s;
}

.toast.mostrar{opacity:1;transform:translate(-50%,0)}

/* ── Animações ─────────────────────────────────────────────── */
@keyframes aparecer{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulsar{0%,100%{transform:scale(.96);opacity:.75}50%{transform:scale(1.05);opacity:1}}

.redes .rede:nth-child(1){animation:aparecer .6s ease .10s both}
.redes .rede:nth-child(2){animation:aparecer .6s ease .16s both}
.redes .rede:nth-child(3){animation:aparecer .6s ease .22s both}
.redes .rede:nth-child(4){animation:aparecer .6s ease .28s both}
.projetos .projeto:nth-child(1){animation:aparecer .6s ease .32s both}
.projetos .projeto:nth-child(2){animation:aparecer .6s ease .38s both}
.projetos .projeto:nth-child(3){animation:aparecer .6s ease .44s both}
.projetos .projeto:nth-child(4){animation:aparecer .6s ease .50s both}

a:focus-visible,button:focus-visible{outline:2px solid rgb(var(--c1));outline-offset:4px}

/* ── Responsivo ────────────────────────────────────────────── */
@media(max-width:520px){
  main{padding:30px 15px 45px}
  .redes{grid-template-columns:1fr}
  .rede{min-height:64px}
  .estatisticas{gap:7px}
  .estatistica{min-width:0;flex:1;padding:11px 8px}
  .foto-area,.foto-borda{width:160px;height:160px}
  .nome{font-size:1.8rem}
}

@media(max-width:360px){
  .estatistica strong{font-size:.95rem}
  .estatistica span{font-size:.58rem}
  .projeto{padding:13px}
  .projeto-icone{width:45px;height:45px;flex-basis:45px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  body{opacity:1!important;transition:none!important}
}
</style>
</head>
<body>

<main>
  <div class="top-line"></div>

  <section class="perfil">
    <div class="foto-area">
      <div class="foto-glow"></div>
      <div class="foto-borda">
        <img id="foto" alt="Foto de perfil">
      </div>
      <span class="status" title="Perfil ativo" aria-label="Perfil ativo"></span>
    </div>
    <h1 class="nome" id="nome"></h1>
    <p class="subtitulo">Meu perfil e meus projetos</p>
    <div class="estatisticas">
      <div class="estatistica"><strong id="totalProjetos">0</strong><span>Projetos</span></div>
      <div class="estatistica"><strong id="totalRedes">0</strong><span>Redes</span></div>
    </div>
  </section>

  <nav class="redes" id="redes" aria-label="Redes sociais"></nav>

  <section>
    <div class="secao-titulo">
      <div class="secao-titulo-texto">
        <h2>Meus projetos</h2>
        <p>Conheça meus trabalhos e projetos</p>
      </div>
    </div>
    <nav class="projetos" id="projetos" aria-label="Projetos"></nav>
  </section>

  <button class="compartilhar" id="compartilhar" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    Compartilhar meu perfil
  </button>

  <footer><p>Feito por <strong>Gustavo Almeida</strong></p></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO  ← edite apenas aqui
// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
  nome: "GUSTAVO ALMEIDA",

  /* ── Foto de perfil ────────────────────────────────────────────
     Aceita qualquer PNG ou JPG do seu GitHub (ou arquivo local).

     Opções de URL:
       • PNG/JPG de qualquer repo:
           "https://raw.githubusercontent.com/Gustavo-Almeida-Informatica/Anexador/main/perfil.jpg"
           "https://raw.githubusercontent.com/Gustavo-Almeida-Informatica/Anexador/main/outra-foto.png"

       • Avatar do seu perfil no GitHub:
           "https://github.com/Gustavo-Almeida-Informatica.png"

       • Arquivo local (mesmo repo, via GitHub Pages):
           "perfil.jpg"

     ⚠️  Use sempre raw.githubusercontent.com para arquivos do repo,
         não o link normal do github.com (que não funciona como imagem).  */
  fotoPerfil: "https://scontent-bsb1-1.cdninstagram.com/v/t51.82787-19/874287534_18074532392786284_700725492874095441_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=107&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=dENEHcYxJeUQ7kNvwF1Ui93&_nc_oc=Adonb0F72_zGkZmNappoQtvA0yVqt5tjr6Qi6HQqP89nkhYnB8Arusn7cZrBnl_Cu6KA-XkO07A30O9caa2Nhkf4&_nc_zt=24&_nc_ht=scontent-bsb1-1.cdninstagram.com&_nc_gid=PJydJ66JJVp8TfwA2P8GYw&_nc_ss=7b6a8&oh=00_AQQZiV19IakTqK5nSdgWv-H6MhRgtnB8fTfh8h6HSm47TQ&oe=6AE80D55",

  /* ── Cor automática ────────────────────────────────────────────
     true  → o fundo muda automaticamente conforme as cores da foto
             (foto azul = fundo azul, foto vermelha = fundo vermelho)
     false → mantém as cores padrão rosa/roxo                       */
  corAutomatica: true,

  /* ── Redes sociais ─────────────────────────────────────────────
     tipo: "instagram" | "tiktok" | "linkedin" | "github"          */
  redes: [
    { tipo:"instagram", usuario:"@gustavo.almeida.oficial", url:"https://www.instagram.com/gustavo.almeida.ofc?stkn=MXhibWI0dnBoOHY4NQ==" },
    { tipo:"tiktok",    usuario:"@gustavo.almeida.oficial", url:"https://www.tiktok.com/@gustavo.almeida.oficial?_r=1&_t=ZS-9AB0p246MHE" },
    { tipo:"linkedin",  usuario:"Gustavo Almeida Moura",    url:"https://www.linkedin.com/in/gustavo-almeida-moura-18a67732b?utm_source=share_via&utm_content=profile&utm_medium=member_android" },
    { tipo:"github",    usuario:"Gustavo Almeida",          url:"https://github.com/Gustavo-Almeida-Informatica" }
  ],

  /* ── Projetos ──────────────────────────────────────────────── */
  projetos: [
    { nome:"PROJETA AULA",       url:"https://projetaaula.lovable.app" },
    { nome:"ENEM NOTA MAX",      url:"https://enem-nota-max.ai.studio" },
    { nome:"Era nuclear",        url:"https://github.com/Gustavo-Almeida-Informatica/Era-nuclear" },
    { nome:"em desenvolvimento", url:"https://github.com/Gustavo-Almeida-Informatica/WhatsIA_Control" }
  ]
};
// ═══════════════════════════════════════════════════════════════════


/* ── Carrega foto e extrai cor dominante ───────────────────────────

   Fontes tentadas em ordem:
     1. CONFIG.fotoPerfil (URL do GitHub ou local)
     2. "perfil.jpg" como fallback local
   A página fica oculta e só aparece depois que a cor é extraída,
   para o usuário sempre ver o tema certo (sem flash de outra cor). */

const REDUCAO_MOVIMENTO = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let paginaExibida = false;

function exibirPagina() {
  if (paginaExibida) return;
  paginaExibida = true;
  document.body.style.transition = 'opacity .5s ease';
  document.body.style.opacity    = '1';
}

/* Tempo máximo de espera pela foto (ms). Depois exibe com cor padrão. */
const TIMEOUT_MS = 1200;
const timerFallback = setTimeout(exibirPagina, TIMEOUT_MS);

async function carregarFoto() {
  const img = document.getElementById('foto');

  // Monta lista de fontes sem duplicatas
  const fontes = [CONFIG.fotoPerfil, 'perfil.jpg']
    .filter(Boolean)
    .filter((v, i, a) => a.indexOf(v) === i);

  for (const src of fontes) {
    const ok = await new Promise(res => {
      img.onload  = () => res(true);
      img.onerror = () => res(false);
      img.crossOrigin = 'anonymous'; // necessário para ler pixels do canvas
      img.src = src;
    });
    if (ok && img.naturalWidth > 0) break;
  }

  if (CONFIG.corAutomatica) {
    const cor = await extrairCorDominante(img);
    if (cor) aplicarCorDeFundo(...cor);
  }

  clearTimeout(timerFallback);
  exibirPagina();
}


/* ── Extração de cor dominante via Canvas API ──────────────────────
   Amostra os pixels da imagem e calcula o tom médio, ignorando
   pixels muito escuros, muito claros e tons acinzentados.
   Retorna [r, g, b] ou null se o CORS bloquear a leitura.        */
async function extrairCorDominante(img) {
  try {
    const S   = 80;  // resolução de amostragem (menor = mais rápido)
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = S;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(img, 0, 0, S, S);

    const { data } = ctx.getImageData(0, 0, S, S);
    let rS = 0, gS = 0, bS = 0, n = 0;

    // Amostra 1 pixel a cada 4 (i += 16 porque cada pixel tem 4 bytes: RGBA)
    for (let i = 0; i < data.length; i += 16) {
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a < 128) continue;  // ignora pixels transparentes

      // Brilho perceptual (fórmula humana: olho é mais sensível ao verde)
      const bri = r * .299 + g * .587 + b * .114;
      if (bri < 25 || bri > 235) continue;  // ignora preto puro e branco puro

      // Ignora cinzas (diferença pequena entre os canais)
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx - mn < 20) continue;

      rS += r; gS += g; bS += b; n++;
    }

    if (n < 10) return null;  // pixels insuficientes, mantém cor padrão
    return [rS / n, gS / n, bS / n];

  } catch {
    // CORS impediu a leitura do canvas (imagem de outro domínio sem cabeçalho)
    return null;
  }
}


/* ── Conversões de cor ─────────────────────────────────────────────
   RGB → HSL para decompor a cor dominante em matiz/saturação/brilho
   HSL → RGB para gerar variantes vivas da mesma cor               */

function rgbParaHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const d = mx - mn, l = (mx + mn) / 2;
  if (!d) return [0, 0, l * 100];
  const s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) / 6
          : mx === g ? ((b - r) / d + 2) / 6
          :            ((r - g) / d + 4) / 6;
  return [h * 360, s * 100, l * 100];
}

function hslParaRgb(h, s, l) {
  h /= 360; s /= 100; l /= 100;
  if (!s) { const v = Math.round(l * 255); return [v, v, v]; }
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => {
    t = (t % 1 + 1) % 1;
    return t < 1/6 ? p + (q - p) * 6 * t
         : t < .5  ? q
         : t < 2/3 ? p + (q - p) * (2/3 - t) * 6
         : p;
  };
  return [f(h + 1/3), f(h), f(h - 1/3)].map(v => Math.round(v * 255));
}


/* ── Aplica tema de cor baseado na foto ────────────────────────────
   A partir da cor dominante da imagem, deriva:
     • --c1: versão viva e saturada da cor dominante
     • --c2: mesma família, matiz deslocado 60° (complementar analógico)
     • --bg: fundo muito escuro com sotaque da mesma cor              */
function aplicarCorDeFundo(r, g, b) {
  const [h] = rgbParaHsl(r, g, b);

  const [r1, g1, b1] = hslParaRgb(h,             85, 60); // cor viva principal
  const [r2, g2, b2] = hslParaRgb((h + 60) % 360, 80, 55); // variante deslocada
  const [rB, gB, bB] = hslParaRgb(h,             30,  4); // fundo escuro

  const root = document.documentElement;
  root.style.setProperty('--c1', `${r1},${g1},${b1}`);
  root.style.setProperty('--c2', `${r2},${g2},${b2}`);
  root.style.setProperty('--bg', `${rB},${gB},${bB}`);

  // Atualiza a barra do sistema operacional (mobile)
  const meta = document.getElementById('themeColor');
  if (meta) meta.content = `rgb(${rB},${gB},${bB})`;
}

/* ── Compartilhar ──────────────────────────────────────────────── */
const toast = document.getElementById('toast');

function mostrarToast(msg) {
  toast.textContent = msg;
  toast.classList.add('mostrar');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('mostrar'), 2400);
}

async function compartilharPerfil() {
  const dados = {
    title: 'Gustavo Almeida | Anexador',
    text:  'Confira meu perfil e meus projetos.',
    url:   location.href
  };
  if (navigator.share) {
    try { await navigator.share(dados); return; }
    catch(e) { if (e?.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(location.href);
    mostrarToast('Link copiado para a área de transferência!');
  } catch {
    const c = document.createElement('input');
    c.value = location.href;
    document.body.appendChild(c); c.select();
    document.execCommand('copy'); c.remove();
    mostrarToast('Link copiado!');
  }
}

document.getElementById('compartilhar').addEventListener('click', compartilharPerfil);
