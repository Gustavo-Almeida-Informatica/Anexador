<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus links e projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --fundo:#0d0650; --dourado:#e9c75a; --pill:#000; --texto:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--fundo); color:var(--texto);
         font-family:"Open Sans",system-ui,sans-serif; display:flex; justify-content:center; }
  main { width:100%; max-width:480px; padding:32px 20px 48px; text-align:center; }
  .foto { width:160px; height:160px; border-radius:50%; margin:0 auto 16px; padding:5px;
          background:linear-gradient(135deg,#f7e98e,#c8962c); }
  .foto img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
              border:4px solid var(--fundo); background:#bfe0ff; }
  h1 { font-size:1.1rem; margin:0 0 28px; }
  h2 { font-size:1.05rem; margin:36px 0 16px; }
  .redes { display:flex; flex-direction:column; gap:16px; }
  .rede { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; }
  .rede svg { width:52px; height:52px; flex:none; }
  .rede span { flex:1; background:var(--pill); border-radius:999px; padding:14px 12px;
               font-weight:700; font-size:1.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .projetos { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .projeto { background:var(--pill); color:inherit; text-decoration:none; border-radius:999px;
             padding:12px 10px; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a:focus-visible { outline:3px solid var(--dourado); outline-offset:3px; border-radius:999px; }
  a:hover span, a.projeto:hover { background:#1b1b1b; }
  @media (max-width:360px) { .projetos { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <div class="foto"><img id="foto" alt="Foto de perfil" src="perfil.jpg"></div>
  <h1 id="nome"></h1>

  <nav class="redes" id="redes" aria-label="Redes sociais"></nav>

  <h2>Conheça meus projetos</h2>
  <nav class="projetos" id="projetos" aria-label="Projetos"></nav>
</main>

<script>
/* ====== EDITE AQUI ====== */
const CONFIG = {
  nome: "GUSTAVO ALMEIDA",
  redes: [
    { tipo: "instagram", usuario: "@gustavo.almeida.oficial", url: "https://www.instagram.com/gustavo.almeida.ofc?stkn=MXhibWI0dnBoOHY4NQ==" },
    { tipo: "tiktok",    usuario: "@gustavo.almeida.oficial", url: "https://www.tiktok.com/@gustavo.almeida.oficial?_r=1&_t=ZS-9AB0p246MHE" },
    { tipo: "linkedin",  usuario: "Gustavo Almeida Moura", url: "https://www.linkedin.com/in/gustavo-almeida-moura-18a67732b?utm_source=share_via&utm_content=profile&utm_medium=member_android" },
    { tipo: "github",    usuario: "Gustavo Almeida", url: "https://github.com/Gustavo-Almeida-Informatica" }
  ],
  projetos: [
    { nome: "PROJETA AULA", url: "https://projetaaula.lovable.app" },
    { nome: "ENEM NOTA MAX", url: "https://enem-nota-max.ai.studio" },
    { nome: "Era nuclear", url: "https://github.com/Gustavo-Almeida-Informatica/Era-nuclear" },
    { nome: "em desenvolvimento", url: "https://github.com/Gustavo-Almeida-Informatica/WhatsIA_Control" }
  ],
  /* fotos dentro da pasta "fotos/": uma por rede + uma padrão */
  fotoPeloPerfil: true, /* true = tenta buscar a foto pelo link do perfil; false = só usa os arquivos */
  fotos: { instagram: "perfil.jpg", tiktok: "perfil.jpg", padrao: "perfil.jpg" }
};
/* ======================== */

const ICONES = {
  instagram: '<svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fdc468"/><stop offset=".5" stop-color="#df4996"/><stop offset="1" stop-color="#6a3fd0"/></linearGradient></defs><rect width="52" height="52" rx="13" fill="url(#ig)"/><rect x="11" y="11" width="30" height="30" rx="9" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="26" cy="26" r="7" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="35" cy="17" r="2" fill="#fff"/></svg>',
  tiktok: '<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="26" fill="#000"/><path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#25f4ee" stroke-width="4.5" stroke-linecap="round" transform="translate(-1.5 1)"/><path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#fe2c55" stroke-width="4.5" stroke-linecap="round" transform="translate(1.5 -1)"/><path d="M28 12v19a6 6 0 1 1-6-6M28 12c.6 4 3 6.4 8 6.8" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>',
  linkedin: '<svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="6" fill="#0a66c2"/><rect x="9" y="20" width="7" height="22" fill="#fff"/><circle cx="12.5" cy="12.5" r="4" fill="#fff"/><path d="M21 20h7v3c1.5-2.4 4-3.6 7-3.6 6 0 8 3.6 8 9.6V42h-7V30c0-3-1-4.6-3.6-4.6S28 27 28 30v12h-7z" fill="#fff"/></svg>',
  github: '<svg viewBox="0 0 52 52" aria-hidden="true"><rect x="10" y="10" width="32" height="32" rx="5" transform="rotate(45 26 26)" fill="none" stroke="#000" stroke-width="4"/><circle cx="21" cy="19" r="3.2" fill="none" stroke="#000" stroke-width="3"/><circle cx="21" cy="33" r="3.2" fill="none" stroke="#000" stroke-width="3"/><circle cx="32" cy="27" r="3.2" fill="none" stroke="#000" stroke-width="3"/><path d="M21 22v8M21 30c0-3 11-1 11-6" fill="none" stroke="#000" stroke-width="3"/></svg>'
};

/* 1) Descobre de onde o visitante veio */
function origem() {
  const param = new URLSearchParams(location.search).get("from");
  if (param) return param.toLowerCase();
  const ua = navigator.userAgent || "";
  if (/Instagram/i.test(ua)) return "instagram";
  if (/TikTok|musical_ly|Bytedance/i.test(ua)) return "tiktok";
  return "padrao";
}

/* 2) Foto: tenta pegar pelo link do perfil; se falhar, usa o arquivo da pasta fotos/ */
function usuarioDaUrl(rede) {
  const r = CONFIG.redes.find(x => x.tipo === rede);
  if (!r) return null;
  const partes = new URL(r.url).pathname.split("/").filter(Boolean);
  return (partes[0] || "").replace(/^@/, "") || null;
}

function fotosParaTentar() {
  const o = origem();
  const lista = [];
  const user = usuarioDaUrl(o);
  if (CONFIG.fotoPeloPerfil && user && o !== "padrao") {
    if (o === "github") lista.push(`https://github.com/${user}.png`);
    else lista.push(`https://unavatar.io/${o}/${user}`);
  }
  if (CONFIG.fotos[o]) lista.push(CONFIG.fotos[o]);
  lista.push(CONFIG.fotos.padrao);
  return lista;
}

const foto = document.getElementById("foto");
const tentativas = fotosParaTentar();
function proxima() {
  if (!tentativas.length) return;
  foto.onerror = proxima;
  foto.src = tentativas.shift();
}
proxima();

/* 3) Monta a página */
document.getElementById("nome").textContent = CONFIG.nome;

document.getElementById("redes").innerHTML = CONFIG.redes.map(r =>
  `<a class="rede" href="${r.url}" target="_blank" rel="noopener" aria-label="${r.tipo}">
     ${ICONES[r.tipo] || ""}<span>${r.usuario}</span></a>`).join("");

document.getElementById("projetos").innerHTML = CONFIG.projetos.map(p =>
  `<a class="projeto" href="${p.url}" target="_blank" rel="noopener">${p.nome}</a>`).join("");
</script>
</body>
</html>
